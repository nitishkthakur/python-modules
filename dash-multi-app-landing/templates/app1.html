<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-brand {
            font-weight: bold;
        }
        .chat-window {
            height: 300px;
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
            overflow-y: scroll;
            background-color: #f8f9fa;
        }
        .message {
            margin-bottom: 5px;
        }
        .message-time {
            font-size: 0.8em;
            color: #6c757d;
            margin-left: 10px;
        }
        .send-section {
            position: sticky;
            bottom: 0;
            background: white;
            padding: 10px 0;
        }
    </style>
</head>
<body>
    <!-- Blue Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">App 1</a>
        </div>
    </nav>

    <!-- Main content -->
    <div class="container mt-4">
        <div class="row">
            <div class="col">
                <h3 class="mb-3">Chat Application 1</h3>
                
                <!-- Chat window -->
                <div class="chat-window" id="chat-window">
                    {% for message in messages %}
                    <div class="message">
                        <strong>You:</strong> {{ message.text }}
                        <span class="message-time">{{ message.timestamp }}</span>
                    </div>
                    {% endfor %}
                </div>
                
                <!-- Input section -->
                <div class="send-section">
                    <form id="chat-form" class="row g-2">
                        <div class="col-9">
                            <input type="text" class="form-control" id="message-input" placeholder="Type your message..." required>
                        </div>
                        <div class="col-3">
                            <button type="submit" class="btn btn-primary w-100">Send</button>
                        </div>
                    </form>
                    <div class="mt-2">
                        <button type="button" class="btn btn-secondary btn-sm" onclick="clearChat()">Clear Chat</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const chatWindow = document.getElementById('chat-window');

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const message = messageInput.value.trim();
            if (!message) return;

            try {
                const formData = new FormData();
                formData.append('message', message);

                const response = await fetch('/send', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    messageInput.value = '';
                    await loadMessages();
                    scrollToBottom();
                }
            } catch (error) {
                console.error('Error sending message:', error);
            }
        });

        async function loadMessages() {
            try {
                const response = await fetch('/messages');
                const data = await response.json();
                
                chatWindow.innerHTML = '';
                data.messages.forEach(msg => {
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'message';
                    messageDiv.innerHTML = `
                        <strong>You:</strong> ${msg.text}
                        <span class="message-time">${msg.timestamp}</span>
                    `;
                    chatWindow.appendChild(messageDiv);
                });
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }

        async function clearChat() {
            try {
                const response = await fetch('/clear', {
                    method: 'DELETE'
                });

                if (response.ok) {
                    await loadMessages();
                }
            } catch (error) {
                console.error('Error clearing chat:', error);
            }
        }

        function scrollToBottom() {
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        // Load messages on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadMessages();
            scrollToBottom();
        });

        // Auto-refresh messages every 2 seconds
        setInterval(loadMessages, 2000);
    </script>
</body>
</html>
